{% extends "base.html" %}

{% block title %}编辑数据集{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">编辑数据集</h1>

    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1.5">名称 <span class="text-red-500">*</span></label>
            <input type="text" name="name" required value="{{ dataset.name }}" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1.5">说明</label>
            <textarea name="description" rows="4" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition resize-none">{{ dataset.description }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1.5">标签</label>
            <input type="text" name="tags" value="{{ dataset.tags }}" placeholder="多个标签用逗号分隔" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div class="flex justify-end gap-3 mt-6">
            <a href="{{ url_for('datasets.detail', dataset_id=dataset.id) }}" class="px-6 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition">取消</a>
            <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-xl transition shadow-sm">保存修改</button>
        </div>
    </form>
</div>
{% endblock %}
