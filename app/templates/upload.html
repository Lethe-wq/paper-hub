{% extends "base.html" %}

{% block title %}上传论文{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">上传论文</h1>

    <form id="uploadForm" method="post" enctype="multipart/form-data" action="{{ url_for('papers.upload') }}">
        <!-- 拖拽上传区域 -->
        <div id="dropZone" class="relative border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-2xl p-8 text-center hover:border-primary-400 dark:hover:border-primary-500 transition-colors cursor-pointer mb-6"
             x-data="{ dragging: false }"
             @dragover.prevent="dragging = true"
             @dragleave.prevent="dragging = false"
             @drop.prevent="handleDrop($event)"
             :class="dragging ? 'border-primary-400 dark:border-primary-500 bg-primary-50 dark:bg-primary-900/10' : ''"
             @click="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" name="file" accept=".pdf" class="hidden" onchange="handleFileSelect(this)">
            <div id="dropContent">
                <svg class="w-12 h-12 mx-auto text-gray-400 dark:text-gray-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-gray-600 dark:text-gray-300 font-medium">拖拽PDF文件到这里，或点击选择文件</p>
                <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">支持 PDF 格式，最大 50MB</p>
            </div>
            <div id="fileInfo" class="hidden">
                <svg class="w-12 h-12 mx-auto text-primary-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <p id="fileName" class="text-primary-600 dark:text-primary-400 font-medium"></p>
                <p id="fileSize" class="text-sm text-gray-400 mt-1"></p>
            </div>
        </div>

        <!-- 解析加载 -->
        <div id="parseLoading" class="hidden text-center py-4">
            <div class="inline-flex items-center gap-2 text-primary-600 dark:text-primary-400">
                <svg class="animate-spin w-5 h-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                正在解析论文信息...
            </div>
        </div>

        <!-- 论文信息表单 -->
        <div id="formFields" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1.5">标题 <span class="text-red-500">*</span></label>
                <input type="text" name="title" id="titleInput" required placeholder="论文标题" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1.5">作者</label>
                    <input type="text" name="authors" id="authorsInput" placeholder="多个作者用逗号分隔" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1.5">年份</label>
                    <input type="number" name="year" id="yearInput" placeholder="2024" min="1900" max="2099" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">摘要</label>
                <textarea name="abstract" id="abstractInput" rows="4" placeholder="论文摘要" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition resize-none"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">标签</label>
                <input type="text" name="tags" id="tagsInput" placeholder="深度学习, 图像分类, 多个标签用逗号分隔" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
            </div>
        </div>

        <!-- 提交 -->
        <div class="flex justify-end gap-3 mt-6">
            <a href="{{ url_for('papers.index') }}" class="px-6 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition">取消</a>
            <button type="submit" id="submitBtn" disabled class="px-6 py-2.5 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 disabled:bg-gray-300 dark:disabled:bg-gray-600 disabled:cursor-not-allowed rounded-xl transition shadow-sm">上传论文</button>
        </div>
    </form>
</div>

<script>
    let selectedFile = null;

    function handleFileSelect(input) {
        if (input.files && input.files[0]) {
            processFile(input.files[0]);
        }
    }

    function handleDrop(event) {
        const files = event.dataTransfer.files;
        if (files && files[0]) {
            if (files[0].type === 'application/pdf') {
                processFile(files[0]);
            } else {
                alert('请上传PDF格式的文件');
            }
        }
    }

    function processFile(file) {
        selectedFile = file;
        document.getElementById('dropContent').classList.add('hidden');
        document.getElementById('fileInfo').classList.remove('hidden');
        document.getElementById('fileName').textContent = file.name;
        document.getElementById('fileSize').textContent = formatSize(file.size);

        // 创建新的 DataTransfer 并设置文件
        const dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('fileInput').files = dt.files;

        // 启用提交按钮
        document.getElementById('submitBtn').disabled = false;

        // 自动解析PDF元数据
        parsePdf(file);
    }

    async function parsePdf(file) {
        document.getElementById('parseLoading').classList.remove('hidden');
        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('{{ url_for("papers.parse_pdf") }}', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.title) document.getElementById('titleInput').value = data.title;
            if (data.authors) document.getElementById('authorsInput').value = data.authors;
            if (data.year) document.getElementById('yearInput').value = data.year;
            if (data.abstract) document.getElementById('abstractInput').value = data.abstract;
        } catch (e) {
            console.log('自动解析失败，请手动填写');
        } finally {
            document.getElementById('parseLoading').classList.add('hidden');
        }
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }
</script>
{% endblock %}
