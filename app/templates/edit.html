{% extends "base.html" %}

{% block title %}编辑 - {{ paper.title }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <a href="{{ url_for('papers.detail', paper_id=paper.id) }}" class="inline-flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 transition mb-4">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        返回详情
    </a>

    <h1 class="text-2xl font-bold mb-6">编辑论文信息</h1>

    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1.5">标题 <span class="text-red-500">*</span></label>
            <input type="text" name="title" value="{{ paper.title }}" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1.5">作者</label>
                <input type="text" name="authors" value="{{ paper.authors }}" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1.5">年份</label>
                <input type="number" name="year" value="{{ paper.year or '' }}" min="1900" max="2099" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1.5">摘要</label>
            <textarea name="abstract" rows="4" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition resize-none">{{ paper.abstract }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium mb-1.5">标签</label>
            <input type="text" name="tags" value="{{ paper.tags }}" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-600 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition">
        </div>
        <div class="flex justify-end gap-3 mt-6">
            <a href="{{ url_for('papers.detail', paper_id=paper.id) }}" class="px-6 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-xl transition">取消</a>
            <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 rounded-xl transition shadow-sm">保存修改</button>
        </div>
    </form>
</div>
{% endblock %}
